name: Publish IdleHub 3.0.14
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Approved private repository run ID
        required: true
        default: '39165593368'
        type: string
      confirm:
        description: Type PUBLICAR-v3.0.14
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLICAR-v3.0.14' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify approved build and source access
        env:
          SOURCE_TOKEN: ${{ secrets.IDLEHUB_SOURCE_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          test -n "$SOURCE_TOKEN" || { echo "Missing IDLEHUB_SOURCE_READ_TOKEN secret"; exit 1; }
          info=$(GH_TOKEN="$SOURCE_TOKEN" gh api "repos/CaduCalegari/IdleHub/actions/runs/$RUN_ID")
          test "$(jq -r .conclusion <<<"$info")" = "success"
          test "$(jq -r .head_branch <<<"$info")" = "release-candidate/v3.0.14-orbit-1810"
          test "$(jq -r .head_sha <<<"$info")" = "764156cfecad0f227a5e50714cbc53f5eddc6880"
          if gh release view v3.0.14 --repo CaduCalegari/IdleHub-Releases >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite"
            exit 1
          fi
      - name: Download approved installer artifact
        env:
          GH_TOKEN: ${{ secrets.IDLEHUB_SOURCE_READ_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p package
          gh run download "$RUN_ID" -R CaduCalegari/IdleHub -n idlehub-windows-dev-nao-homologado -D package
      - name: Verify installer files
        run: |
          set -euo pipefail
          echo "Downloaded artifact inventory:"
          find package -type f -printf '%P (%s bytes)\\n'
          mkdir -p release-files
          for filename in IdleHub-v3.0.14-Setup.exe IdleHub-v3.0.14-Setup.exe.blockmap latest.yml; do
            mapfile -d '' matches < <(find package -type f -name "$filename" -print0)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one $filename; found ${#matches[@]}"
              exit 1
            fi
            cp -- "${matches[0]}" "release-files/$filename"
            test -s "release-files/$filename"
          done
          grep -Eq '^version: *3\\.0\\.14 *$' release-files/latest.yml
          grep -Fq 'IdleHub-v3.0.14-Setup.exe' release-files/latest.yml
          test "$(stat -c %s release-files/IdleHub-v3.0.14-Setup.exe)" -gt 1000000
      - name: Publish official release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v3.0.14 release-files/IdleHub-v3.0.14-Setup.exe release-files/IdleHub-v3.0.14-Setup.exe.blockmap release-files/latest.yml --repo CaduCalegari/IdleHub-Releases --title "IdleHub v3.0.14 - beta controlada" --notes "Beta controlada: Windows CI passou. Confirmar login Google real apos atualizar." --latest
